[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enm"
version = "0.1.0"
description = "A Python package to compute Empirical Normal Modes from atmospheric data."
readme = "README.md"
authors = [
    { name = "Charlie Egan", email = "c.egan@reading.ac.uk" }
]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]

# Core dependencies for atmospheric science data and computations
dependencies = [
    "numpy>=1.22.0",
    "xarray>=2022.03.0",
    "scipy>=1.8.0",
    "netcdf4>=1.5.8",
    "cdsapi>=0.5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enm*"]
